[build]
  publish = "preview-mayank"
  command = "echo 'Static site — no build step needed.'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # El sitio solo carga archivos propios. Google Fonts y 'unsafe-inline' en estilos
    # son solo para cv-print.html (plantilla del PDF, con <style> e @import de fuentes).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/publicaciones"
  to = "/publicaciones.html"
  status = 301
  force = false

[[redirects]]
  from = "/actividades"
  to = "/actividades.html"
  status = 301
  force = false

[[redirects]]
  from = "/cv"
  to = "/cv.html"
  status = 301
  force = false
